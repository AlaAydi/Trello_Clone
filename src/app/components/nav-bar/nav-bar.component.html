<div class="{{board? board.base : ''}}">
  <nav id="nav-bar"
    class="{{boardPage && board? 'text-cc-boardpage-nav-text bg-cc-boardpage-nav-bg duration-200' : 'bg-cc-base text-cc-subtle'}} flex font-semibold justify-between p-2 border-b border-cc-border/15">
    <div class="flex gap-1">
   
      <a routerLink="/" class="{{boardPage && board? 'hover:bg-cc-boardpage-menu-hover' : 'hover:bg-cc-overlay'}} px-2 rounded-sm" aria-label="Back to home">
        <div id="trello-logo" class="{{boardPage && board? 'board-logo-filter' : 'logo-filter'}} w-[72px] h-8"></div>
      </a>
      <app-workspaces-dropdown [boardPage]="boardPage" [board]="board"></app-workspaces-dropdown>
      <app-recent-dropdown [boardPage]="boardPage" [board]="board"></app-recent-dropdown>
      @if (authService.isTechLead) {
        <a routerLink="/approvals" 
          class="{{boardPage && board? 'hover:bg-cc-boardpage-menu-hover' : 'hover:bg-cc-overlay'}} px-3 py-1 rounded-sm text-sm flex items-center transition-colors relative"
          [routerLinkActive]="'bg-cc-accent/20 text-cc-accent'">
          Approvals
          @if (pendingCount > 0) {
            <span class="absolute -top-1 -right-1 flex h-4 w-4">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-4 w-4 bg-rose-600 text-[10px] text-white items-center justify-center font-bold">
                {{pendingCount}}
              </span>
            </span>
          }
        </a>
        <app-create-dropdown class="ms-1" [boardPage]="boardPage" [board]="board"></app-create-dropdown>
      }
    </div>
    <div class="flex items-center gap-2">
      <app-theme-dropdown [boardPage]="boardPage" [board]="board"></app-theme-dropdown>
      <button 
        *ngIf="authService.isLoggedIn"
        (click)="logout()"
        class="ml-2 rounded-sm px-2 py-1 text-xs font-bold uppercase tracking-tight text-white transition-colors hover:bg-red-600 bg-red-500"
      >
        Logout
      </button>
    </div>
  </nav>
</div>
